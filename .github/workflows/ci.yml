name: CPU verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and common HTTP client
        run: python -m pip install -e '.[client]'
      - name: Test protocol, streaming, analysis, budgets, and process cleanup
        run: python -m unittest discover -s tests -v
      - name: Print the offline plan
        run: python -m inference_bench plan
      - name: Reproduce the synthetic report and bundle
        run: |
          python -m inference_bench example --output artifacts/example
          python -m inference_bench verify-artifacts --input artifacts/example
          python -m inference_bench analyze --input artifacts/example --output artifacts/example-report --allow-synthetic
          python -m inference_bench bundle --input artifacts/example --output artifacts/example.tar.gz --allow-synthetic
      - name: Exercise synthetic pilot forecasting, qualification, and ledger reports
        run: |
          python -m inference_bench example --phase pilot --output artifacts/example-pilot
          python -m inference_bench forecast --input artifacts/example-pilot --ledger artifacts/example-pilot/budget-ledger.json --allow-synthetic
          python -m inference_bench qualify --input artifacts/example-pilot --engine vllm --output artifacts/qualification-vllm.json --allow-synthetic --accept "cpu_preflight=Synthetic CI fixture"
          python -m inference_bench ledger --ledger artifacts/example-pilot/budget-ledger.json
